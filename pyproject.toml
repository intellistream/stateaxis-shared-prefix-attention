[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-shared-prefix-attention"
version = "0.2.0"
description = "Generation-bound shared-prefix attention admission for StateAxis"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext>=0.3,<0.4"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-shared-prefix-attention" = "stateaxis_shared_prefix_attention"

[project.entry-points."stateaxis.mod_handlers"]
shared_prefix_attention = "stateaxis_shared_prefix_attention:shared_prefix_attention"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_shared_prefix_attention"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
